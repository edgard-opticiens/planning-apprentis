<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning apprentis</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#152238;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:20px}
  .card{width:100%;max-width:460px;background:#fffbf8;border-radius:16px;
        box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden}
  .head{background:#152238;padding:22px 26px;border-bottom:3px solid #A97A2E;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .head h1{color:#fff;font-size:18px;font-weight:700}
  .head p{color:#c9b78e;font-size:13px;margin-top:4px}
  .logout{background:none;border:0;color:#c9b78e;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;white-space:nowrap;padding:0}
  .logout:hover{color:#fff}
  .body{padding:24px 26px}
  label{display:block;font-size:13px;color:#55505e;margin:0 0 5px;font-weight:600}
  input,select{width:100%;padding:11px;border:1px solid #d9cdbf;border-radius:8px;font-size:15px;background:#fff}
  input:focus,select:focus{outline:none;border-color:#A97A2E}
  #code{letter-spacing:6px;text-align:center;font-weight:700;font-size:20px}
  .field{margin-bottom:16px}
  .connecte{min-height:20px;margin:0 0 16px;font-size:14px;font-weight:600;color:#2e7d32}
  .steps{margin-top:8px;border-top:1px solid #eaded2;padding-top:18px}
  .step{margin-bottom:18px}
  .step .t{font-size:13px;color:#9c4f38;font-weight:700;margin-bottom:8px}
  button,.btn{width:100%;padding:13px;border:0;border-radius:8px;font-weight:700;font-size:15px;
        cursor:pointer;transition:opacity .15s;display:block;text-align:center;text-decoration:none}
  .open{background:#152238;color:#fff}
  .send,.login{background:#A97A2E;color:#fff}
  button:hover:not(:disabled),.open:hover{opacity:.9}
  button:disabled{background:#cbb98f;cursor:not-allowed}
  .open.dis{background:#b9b2ba;cursor:not-allowed;pointer-events:none}
  .row-mois{margin-bottom:10px}
  .msg{margin-top:12px;font-size:14px;min-height:20px;text-align:center;font-weight:600}
  .login-msg{margin-top:4px;font-size:13px;min-height:18px;font-weight:600}
  .note{margin-top:16px;font-size:11.5px;color:#8a8290;line-height:1.5;text-align:center}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div>
        <h1>Planning des apprentis</h1>
        <p>Complétez votre planning, puis envoyez-le au service RH.</p>
      </div>
      <button type="button" class="logout hidden" id="btn-logout" onclick="deconnexion()">Se déconnecter</button>
    </div>
    <div class="body">

      <div id="bloc-login">
        <div class="field">
          <label for="magasin-select">Mon magasin</label>
          <select id="magasin-select">
            <option value="">— Choisir —</option>
            <option value="ANGO">ANGO</option>
            <option value="BIARRO">BIARRO</option>
            <option value="BORDO">BORDO</option>
            <option value="CAENPO">CAENPO</option>
            <option value="CHATO">CHATO</option>
            <option value="CHEMILLO">CHEMILLO</option>
            <option value="CHOLO">CHOLO</option>
            <option value="DUNES">DUNES</option>
            <option value="ECUME">ECUME</option>
            <option value="FORMIO">FORMIO</option>
            <option value="GIRO">GIRO</option>
            <option value="HAVRO">HAVRO</option>
            <option value="JISAM">JISAM</option>
            <option value="LYONO">LYONO</option>
            <option value="MANSO">MANSO</option>
            <option value="MARAIS">MARAIS</option>
            <option value="MARSEILLO">MARSEILLO</option>
            <option value="MUDO">MUDO</option>
            <option value="NANCEO">NANCEO</option>
            <option value="NANTO">NANTO</option>
            <option value="NICEO">NICEO</option>
            <option value="NIORTO">NIORTO</option>
            <option value="ORLO">ORLO</option>
            <option value="REIMO">REIMO</option>
            <option value="STRABO">STRABO</option>
            <option value="TURO">TURO</option>
          </select>
        </div>
        <div class="field">
          <label for="code">Code directeur (8 caractères)</label>
          <input id="code" type="text" maxlength="8" placeholder="••••••••" autocomplete="off" style="text-transform:uppercase">
        </div>
        <button type="button" class="login" id="btn-login" onclick="connexion()">Se connecter</button>
        <div class="login-msg" id="login-msg"></div>
      </div>

      <div id="bloc-connecte" class="hidden">
        <div class="connecte" id="connecte-txt"></div>

        <div class="steps">
          <div class="step">
            <div class="t">1. Compléter mon planning</div>
            <a id="btn-open" class="open dis" target="_blank" rel="noopener">Chargement du lien…</a>
          </div>
          <div class="step">
            <div class="t">2. Envoyer au RH</div>
            <div class="row-mois">
              <select id="mois">
                <option value="06">Juin 2026</option><option value="07">Juillet 2026</option>
                <option value="08">Août 2026</option><option value="09">Septembre 2026</option>
                <option value="10">Octobre 2026</option><option value="11">Novembre 2026</option>
                <option value="12">Décembre 2026</option>
              </select>
            </div>
            <button id="btn-send" class="send" onclick="envoyer()">Envoyer au RH</button>
          </div>
          <div class="msg" id="msg"></div>
        </div>
      </div>

      <div class="note" id="note">Connexion sécurisée avec votre code directeur (vérifié par le serveur). L'envoi transmet votre fichier complet au service RH.</div>
    </div>
  </div>

<script>
const BASE = "https://edgard-opticiens.app.n8n.cloud/webhook/";
const DIR_KEY = "edgard_auth_v2"; // meme cle que les portails Edgard/GdO (Espace directeur), tableaudebordCP et le calendrier

function session(){
  try{
    const s = JSON.parse(localStorage.getItem(DIR_KEY) || "null");
    if(s && s.token && s.role === 'DIR' && s.magasin && Number(s.expire) > Date.now()) return s;
  }catch(e){}
  return null;
}
function enregistrerSession(s){
  try{ localStorage.setItem(DIR_KEY, JSON.stringify(s)); }catch(e){}
}
function effacerSession(){
  try{ localStorage.removeItem(DIR_KEY); }catch(e){}
}

function afficherConnecte(magasin){
  document.getElementById('bloc-login').classList.add('hidden');
  document.getElementById('bloc-connecte').classList.remove('hidden');
  document.getElementById('btn-logout').classList.remove('hidden');
  document.getElementById('connecte-txt').textContent = "Connecté : " + magasin;
}
function afficherLogin(){
  document.getElementById('bloc-login').classList.remove('hidden');
  document.getElementById('bloc-connecte').classList.add('hidden');
  document.getElementById('btn-logout').classList.add('hidden');
}

function deconnexion(){
  effacerSession();
  document.getElementById('code').value = "";
  document.getElementById('login-msg').textContent = "";
  afficherLogin();
}

async function connexion(){
  const magasin = document.getElementById('magasin-select').value;
  const code = document.getElementById('code').value.trim();
  const btn = document.getElementById('btn-login'), msg = document.getElementById('login-msg');
  msg.textContent = ""; msg.style.color = "#55505e";
  if(!magasin){ msg.textContent = "Choisissez votre magasin."; msg.style.color = "#c62828"; return; }
  if(!/^[A-Za-z0-9]{8}$/.test(code)){ msg.textContent = "Le code directeur fait 8 caractères (lettres et chiffres)."; msg.style.color = "#c62828"; return; }
  btn.disabled = true; msg.textContent = "Connexion en cours…";
  try{
    const res = await fetch(BASE + "auth-login", { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ role: "DIR", magasin, code }) });
    const d = await res.json().catch(()=>({}));
    if(d && d.ok){
      enregistrerSession({ token: d.token, role: "DIR", magasin: d.magasin, expire: d.expire });
      msg.textContent = "";
      afficherConnecte(d.magasin);
      chargerPlanning();
    } else if(d && d.error === 'verrouille'){
      msg.textContent = "Trop d'essais. Réessayez dans " + (d.minutes || 15) + " min.";
      msg.style.color = "#c62828";
    } else {
      msg.textContent = "Magasin ou code directeur incorrect.";
      msg.style.color = "#c62828";
    }
  }catch(e){
    msg.textContent = "Erreur réseau — réessayez.";
    msg.style.color = "#c62828";
  }finally{
    btn.disabled = false;
  }
}

async function chargerPlanning(){
  const s = session();
  const open = document.getElementById('btn-open');
  if(!s){ afficherLogin(); return; }
  open.classList.add('dis'); open.removeAttribute('href'); open.textContent = "Chargement du lien…";
  try{
    const res = await fetch(BASE + "secure-read", { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ token: s.token, source: "plannings", params: {} }) });
    if(res.status === 401){ effacerSession(); afficherLogin(); return; }
    const d = await res.json().catch(()=>({}));
    const liste = (d && d.ok && d.resultat && d.resultat.plannings) || [];
    const mien = liste[0];
    if(mien && mien.webUrl){
      open.href = mien.webUrl; open.classList.remove('dis'); open.textContent = "Ouvrir mon planning (Excel)";
    } else {
      open.removeAttribute('href'); open.classList.add('dis'); open.textContent = "Lien pas encore disponible";
    }
  }catch(e){
    open.removeAttribute('href'); open.classList.add('dis'); open.textContent = "Erreur de chargement du lien";
  }
}

async function envoyer(){
  const s = session();
  const btn = document.getElementById('btn-send'), msg = document.getElementById('msg');
  const mois = document.getElementById('mois').value;
  if(!s){ afficherLogin(); return; }
  btn.disabled = true; msg.textContent = "Envoi en cours…"; msg.style.color = "#55505e";
  try{
    const res = await fetch(BASE + "envoi-planning-rh", { method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ token: s.token, mois }) });
    if(res.ok){ msg.textContent = "✓ Planning envoyé au RH."; msg.style.color = "#2e7d32"; btn.disabled = false; }
    else if(res.status === 401){
      msg.textContent = "Session expirée — reconnectez-vous."; msg.style.color = "#c62828";
      effacerSession(); afficherLogin();
    } else {
      const d = await res.json().catch(()=>({}));
      msg.textContent = (d.message || "Erreur lors de l'envoi."); msg.style.color = "#c62828"; btn.disabled = false;
    }
  }catch(e){
    msg.textContent = "Erreur réseau — réessayez."; msg.style.color = "#c62828"; btn.disabled = false;
  }
}

(function init(){
  const s = session();
  if(s){ afficherConnecte(s.magasin); chargerPlanning(); }
  else { afficherLogin(); }
  document.getElementById('code').addEventListener('keydown', function(e){ if(e.key === 'Enter') connexion(); });
})();
</script>
</body>
</html>
